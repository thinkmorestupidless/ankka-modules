# Beside the original's dev/compose/full-stack.yml when it is recorded (spec 001 FR-029; tests/original/README.md):
#   docker compose -f dev/compose/full-stack.yml -f ../ankka-casino/tests/original/compose.override.yml up -d
# Every payment provider the original calls answers from psp-stub (tests/stubs/psp-stub, spec 005 FR-025),
# one port per provider, and the gateway's base URLs are pointed at it. Without these settings seven
# adapters fall back to production or sandbox hosts.
services:
  psp-stub:
    image: psp-stub
    build:
      context: ../../../ankka-casino/tests
      dockerfile: stubs/psp-stub/Dockerfile
    ports:
      - "18101-18109:18101-18109"
    environment:
      # every provider's webhook goes to the gateway's route for it (contracts/routes.md)
      PSP_STUB_GATEWAY_URL: "http://psp-gateway:8087"
      T365_STUB_PUBLIC_URL: "http://localhost:18107"

  psp-gateway:
    environment:
      BOUNCEMONEY_BASE_URL: "http://psp-stub:18101"
      COZENI_BASE_URL: "http://psp-stub:18102"
      # the player's browser posts DreamzPay's form, so this is the host's address, not the container's
      DREAMZPAY_BASE_URL: "http://localhost:18103"
      EUPAYMENTZ_BASE_URL: "http://psp-stub:18104"
      GIGADAT_BASE_URL: "http://psp-stub:18105"
      MORPHOSIS_BASE_URL: "http://psp-stub:18106/"
      T365_BASE_URL: "http://psp-stub:18107"
      UNITYFINANCE_PAY_URL: "http://psp-stub:18108"
      UNITYFINANCE_API_URL: "http://psp-stub:18108/v1"
      # the original reads only DIGITARIUM_BASE_URL (config.go:188); the two below are the port's names (research R10)
      DIGITARIUM_BASE_URL: "http://psp-stub:18109"
      DIGITARIUM_SANDBOX_URL: "http://psp-stub:18109"
      DIGITARIUM_PRODUCTION_URL: "http://psp-stub:18109"
      # the stubs post webhooks here; a browser cannot resolve it, so hosted pages are driven by the suite
      PSP_GATEWAY_BASE_URL: "http://psp-gateway:8087"
    depends_on: [psp-stub]

  # Customer.io's two hosts (spec 014 research R2). The original's clients read these variables only
  # with e2e-crm.patch applied; without it they call Customer.io itself.
  crm-stub:
    image: crm-stub
    build:
      context: ../../../ankka-casino/tests
      dockerfile: stubs/crm-stub/Dockerfile
    ports:
      - "18201-18202:18201-18202"

  casino-service:
    environment:
      CUSTOMERIO_TRACK_URL: "http://crm-stub:18201"
      CUSTOMERIO_APP_URL: "http://crm-stub:18202"
    depends_on: [crm-stub]
