name: release

# One `v*` tag publishes every service's image and every module manifest at the tag's version to
# ankka-vendor, and moves no channel (spec 021 FR-004, SC-004, contracts/release.md). Which release a
# brand runs is its entitlement's channel or pin at the vendor; moving a channel is a person's act
# afterwards (modules/README.md). `just release-dry <version>` runs the publish loop against a fake.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  services:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.list.outputs.names }}
      version: ${{ steps.list.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          names=$(ls services/*/build.sbt | cut -d/ -f2 | jq -R . | jq -cs .)
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  # Each service's own sbt build publishes its image at the tag to the casino's registry.
  images:
    needs: services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJson(needs.services.outputs.names) }}
    env:
      CASINO_VERSION: ${{ needs.services.outputs.version }}
      SERVICE_VERSION: ${{ needs.services.outputs.version }}
      DOCKER_REPOSITORY: europe-west1-docker.pkg.dev/eitheror/casino
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: docker/login-action@v3
        with:
          registry: europe-west1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.CASINO_REGISTRY_KEY }}
      - name: Publish the contract locally
        run: sbt contract/publishLocal
      - name: Publish ${{ matrix.service }}'s image
        working-directory: services/${{ matrix.service }}
        run: sbt Docker/publish

  # Every manifest rendered at the tag (images at the version, topic contracts inlined, validated),
  # then published once each, core first. A manifest naming a service with no build fails here,
  # before any publish, naming the service.
  manifests:
    needs: [services, images]
    runs-on: ubuntu-latest
    env:
      # The job runs ankka-vendor without the CLI's dispatch, so it sets what the CLI would hand the
      # plugin itself (contracts/release.md); the plugin takes its token from the client credentials.
      ANKKA_URL: ${{ secrets.ANKKA_VENDOR_URL }}
      ANKKA_TOKEN: ""
      ANKKA_VENDOR_URL: ${{ secrets.ANKKA_VENDOR_URL }}
      ANKKA_VENDOR_CLIENT_ID: ${{ secrets.ANKKA_VENDOR_CLIENT_ID }}
      ANKKA_VENDOR_CLIENT_SECRET: ${{ secrets.ANKKA_VENDOR_CLIENT_SECRET }}
      CASINO_RELEASE_REQUIRE_BUILDS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Install the ankka-vendor plugin
        run: |
          curl -fsSL -o ankka-vendor "${{ secrets.ANKKA_VENDOR_PLUGIN_URL }}"
          chmod +x ankka-vendor && sudo mv ankka-vendor /usr/local/bin/
      - name: Render every manifest at the tag
        run: sbt "modules/run release render ${{ needs.services.outputs.version }} --out target/release"
      - name: Publish every module
        run: scripts/release-publish.sh target/release "${{ needs.services.outputs.version }}" | tee target/release/published.txt
      - uses: actions/upload-artifact@v4
        with:
          name: published
          path: target/release/

  summary:
    needs: [services, manifests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: published
          path: published
      - name: The modules published, and their digests
        run: |
          {
            echo "## Release ${{ needs.services.outputs.version }}"
            echo
            echo "Published to ankka-vendor; no channel moved. Move one with \`ankka vendor channels set <module> <channel> <version>\`."
            echo
            grep '^published ' published/published.txt | sed 's/^published /- /'
          } >> "$GITHUB_STEP_SUMMARY"
