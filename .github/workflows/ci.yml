name: ci

# A pull request runs the jobs its changes reach; a manual run runs all of them.
#
# Pushes to `main` are not built. The branch is protected: a pull request merges only when these
# checks have passed on a head that is up to date with `main`, so the merge commit's tree is the
# tree that was tested, and a second run of it would be the same minutes spent on the same answer.
# A `v*` tag is the release workflow's.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# A new push to a pull request cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which services a pull request's changes reach. Each service's tests read its own directory, its
  # features, its recordings and the contract, and no other service (their kits fake their neighbours),
  # so a change to one service runs that service's job; a change to the contract or the build runs all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      wallet: ${{ steps.filter.outputs.wallet }}
      merchant: ${{ steps.filter.outputs.merchant }}
      psp-gateway: ${{ steps.filter.outputs.psp-gateway }}
      ingest: ${{ steps.filter.outputs.ingest }}
      players: ${{ steps.filter.outputs.players }}
      attribution: ${{ steps.filter.outputs.attribution }}
      affiliate-programme: ${{ steps.filter.outputs.affiliate-programme }}
      game-provider: ${{ steps.filter.outputs.game-provider }}
      simulator: ${{ steps.filter.outputs.simulator }}
      provider: ${{ steps.filter.outputs.provider }}
      responsible-gambling: ${{ steps.filter.outputs.responsible-gambling }}
      kyc: ${{ steps.filter.outputs.kyc }}
      payouts: ${{ steps.filter.outputs.payouts }}
      rewards: ${{ steps.filter.outputs.rewards }}
      engagement: ${{ steps.filter.outputs.engagement }}
      audit: ${{ steps.filter.outputs.audit }}
      reporting: ${{ steps.filter.outputs.reporting }}
      support-agent: ${{ steps.filter.outputs.support-agent }}
      markets: ${{ steps.filter.outputs.markets }}
      exchange: ${{ steps.filter.outputs.exchange }}
    steps:
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            build: &build
              - contract/**
              - build.sbt
              - project/**
              - .github/workflows/ci.yml
            wallet:
              - *build
              - services/wallet/**
              - features/wallet/**
              - tests/port/wallet/**
              - tests/original/wallet-driver/**
            merchant:
              - *build
              - services/merchant/**
              - features/payments/**
              - tests/port/merchant/**
            psp-gateway:
              - *build
              - services/psp-gateway/**
              - features/payments/**
              - tests/port/psp-gateway/**
              - tests/stubs/psp-stub/**
            ingest:
              - *build
              - services/ingest/**
              - features/payments/**
              - tests/port/ingest/**
              - tests/original/ingest-driver/**
            players:
              - *build
              - services/players/**
              - features/players/**
              - tests/port/players/**
              - tests/original/players-driver/**
            attribution:
              - *build
              - services/attribution/**
              - features/attribution/**
              - tests/port/attribution/**
              - tests/original/attribution-driver/**
            affiliate-programme:
              - *build
              - services/affiliate-programme/**
              # attribution's sources build.sbt compiles into this service's tests (the tag verifier)
              - services/attribution/src/main/scala/io/eitheror/casino/attribution/Types.scala
              - services/attribution/src/main/scala/io/eitheror/casino/attribution/Json.scala
              - services/attribution/src/main/scala/io/eitheror/casino/attribution/tag/**
              - tests/original/programme-export/**
              - features/programme/**
              - tests/port/programme/**
              - tests/port/attribution/**
              - tests/original/programme-driver/**
            game-provider:
              - *build
              - provider-core/**
              - services/game-provider/**
              - features/game-provider/**
              - tests/port/game-provider/**
            simulator:
              - *build
              - provider-core/**
              - services/game-provider-simulator/**
              - features/simulator/**
              - tests/port/simulator/**
            provider:
              - *build
              - provider-core/**
              - services/provider/**
              - features/games/**
              - tests/port/simulator/**
            responsible-gambling:
              - *build
              - services/responsible-gambling/**
              - features/responsible-gambling/**
              - tests/port/responsible-gambling/**
            kyc:
              - *build
              - services/kyc/**
              - features/kyc/**
              - tests/port/kyc/**
            payouts:
              - *build
              - services/payouts/**
              - features/payouts/**
              - tests/port/payouts/**
            rewards:
              - *build
              - services/rewards/**
              - features/rewards/**
              - tests/port/rewards/**
            engagement:
              - *build
              - services/engagement/**
              - features/engagement/**
              - tests/port/engagement/**
              - tests/stubs/crm-stub/**
            audit:
              - *build
              - services/audit/**
              - features/audit/**
              - tests/port/audit/**
            reporting:
              - *build
              - services/reporting/**
              - features/reporting/**
              - tests/port/reporting/**
            support-agent:
              - *build
              - services/support-agent/**
              - features/support-agent/**
              - tests/port/support-agent/**
            markets:
              - *build
              - services/markets/**
              - features/predictions/**
            exchange:
              - *build
              - services/exchange/**
              - features/predictions/**

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: astral-sh/setup-uv@v5
      - name: Features, glossary and specs
        run: .github/features-check.sh
      - name: Unit suites and bound features
        run: sbt test
      - name: Every module manifest and every brand's values (spec 021)
        run: sbt "modules/run validate --all"
      - name: The release's publish loop against the fake vendor, moving no channel (spec 021 SC-004)
        run: |
          out="$(mktemp -d)"
          sbt "modules/run release render v9.9.9 --out $out"
          ANKKA_VENDOR_FAKE_LOG="$out/vendor.log" PATH="$PWD/tests/fakes:$PATH" scripts/release-publish.sh "$out" v9.9.9
          ! grep -q '^channels' "$out/vendor.log"
      - name: Schemas match the families
        run: |
          sbt contract/schemas
          git diff --exit-code -- contract/schemas
      - name: Payment-provider and CRM stubs and the wallet and merchant drivers' offline checks
        working-directory: tests
        run: go test ./...

  # game-provider (spec 003): its own sbt build against the contract published from this commit; its
  # integration suites start Postgres in Docker.
  game-provider:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.game-provider == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish the contract and the provider core locally
        run: sbt contract/publishLocal providerCore/publishLocal
      - name: game-provider's suites
        working-directory: services/game-provider
        run: sbt test

  # The wallet (spec 002): its own sbt build against the contract published from this commit. The
  # integration suites start Postgres in Docker, which the hosted runner provides.
  wallet:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.wallet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish the contract locally
        run: sbt contract/publishLocal
      - name: The wallet's suites
        working-directory: services/wallet
        run: sbt test

  # merchant (spec 004), the shared payments project's first service: its own sbt build against the
  # contract published from this commit; its integration suites start Postgres in Docker. The merchant
  # driver's offline checks run in the check job's `go test ./...`.
  merchant:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.merchant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish the contract locally
        run: sbt contract/publishLocal
      - name: merchant's suites
        working-directory: services/merchant
        run: sbt test

  # psp-gateway (spec 005), the shared payments project's second service: its own sbt build against the
  # contract published from this commit; its integration suites start Postgres and psp-stub (built from
  # tests/stubs/psp-stub/Dockerfile) in Docker. The stubs' and the gateway driver's offline checks run
  # in the check job's `go test ./...`.
  psp-gateway:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.psp-gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish the contract locally
        run: sbt contract/publishLocal
      - name: psp-gateway's suites
        working-directory: services/psp-gateway
        run: sbt test

  # ingest (spec 006), the shared payments project's third service: its own sbt build against the
