      - uses: sbt/setup-sbt@v1
      - name: Publish the contract locally
        run: sbt contract/publishLocal
      - name: affiliate-programme's unit suites
        working-directory: services/affiliate-programme
        run: sbt test
      - name: affiliate-programme's integration, parity and feature suites
        working-directory: services/affiliate-programme
        run: sbt -Dit=true "testOnly io.eitheror.casino.programme.it.* io.eitheror.casino.programme.port.* io.eitheror.casino.programme.features.*"

  # The game provider simulator (spec 020): its own sbt build against the contract published from this
  # commit; its suites start Postgres in Docker and run the features of features/simulator.
  simulator:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.simulator == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish the contract and the provider core locally
        run: sbt contract/publishLocal providerCore/publishLocal
      - name: The simulator's suites
        working-directory: services/game-provider-simulator
        run: sbt test

  # The house provider (spec 026): its own sbt build against the contract and the provider core
  # published from this commit; its suites start Postgres in Docker and run the features of
  # features/games.
  provider:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.provider == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish the contract and the provider core locally
        run: sbt contract/publishLocal providerCore/publishLocal
      - name: The provider's suites
        working-directory: services/provider
        run: sbt test
  # A game service in `games` (spec 027 on) copies this job and builds its browser client first
  # (spec 026 contracts/game-client.md); its parity and feature suites need the built page:
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: "22"
  #         cache: npm
  #         cache-dependency-path: services/<game>/client/package-lock.json
  #     - name: The game's browser client
  #       working-directory: services/<game>/client
  #       run: npm ci && npm run build

  # responsible-gambling (spec 010): its own sbt build against the contract published from this commit;
  # its integration suites start Postgres in Docker.
  responsible-gambling:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.responsible-gambling == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish the contract locally
        run: sbt contract/publishLocal
      - name: responsible-gambling's suites
        working-directory: services/responsible-gambling
        run: sbt test

  # kyc (spec 009): its own sbt build against the contract published from this commit; its integration
  # suites start Postgres and Garage in Docker.
  kyc:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.kyc == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish the contract locally
        run: sbt contract/publishLocal
      - name: kyc's suites
        working-directory: services/kyc
        run: sbt test

  # payouts (spec 007): its own sbt build against the contract published from this commit; its integration
  # suites start Postgres in Docker.
  payouts:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.payouts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish the contract locally
        run: sbt contract/publishLocal
      - name: payouts' suites
        working-directory: services/payouts
        run: sbt test

  # rewards (spec 011): its own sbt build against the contract published from this commit. `sbt test` runs
  # the unit suites; the integration, parity and feature suites start Postgres in Docker and run with -Dit=true.
  rewards:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rewards == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish the contract locally
        run: sbt contract/publishLocal
      - name: rewards' suites
        working-directory: services/rewards
        run: sbt test
      - name: rewards' integration, parity and feature suites
        working-directory: services/rewards
        run: sbt -Dit=true "testOnly io.eitheror.casino.rewards.it.* io.eitheror.casino.rewards.port.* io.eitheror.casino.rewards.features.*"

  # engagement (spec 014): its own sbt build, on ankka 0.16.0, against the contract published from this
  # commit. `sbt test` runs the unit suites; the integration, parity and feature suites start Postgres in
  # Docker and run with -Dit=true. crm-stub's checks run in the check job's `go test ./...`.
  engagement:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.engagement == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish the contract locally
        run: sbt contract/publishLocal
      - name: engagement's suites
        working-directory: services/engagement
        run: sbt test
      - name: engagement's integration, parity and feature suites
        working-directory: services/engagement
        run: sbt -Dit=true "testOnly io.eitheror.casino.engagement.it.* io.eitheror.casino.engagement.port.* io.eitheror.casino.engagement.features.*"

  # audit (spec 018), the shared reasoner's service: its own sbt build, on ankka 0.16.0, against the
  # contract published from this commit. `sbt test` runs the unit suites; the integration, parity and
  # feature suites start Postgres in Docker and run with -Dit=true.
  audit:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish the contract locally
        run: sbt contract/publishLocal
      - name: audit's suites
        working-directory: services/audit
        run: sbt test
      - name: audit's integration, parity and feature suites
        working-directory: services/audit
        run: sbt -Dit=true "testOnly io.eitheror.casino.audit.it.* io.eitheror.casino.audit.port.* io.eitheror.casino.audit.features.*"

  # reporting (spec 015): its own sbt build on ankka 0.16.0, against the contract published from this commit.
  # `sbt test` runs the unit suites; the integration, parity and feature suites start Postgres in Docker.
  reporting:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.reporting == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish the contract locally
        run: sbt contract/publishLocal
      - name: reporting's suites
        working-directory: services/reporting
        run: sbt test
      - name: reporting's integration, parity and feature suites
        working-directory: services/reporting
        run: sbt -Dit=true "testOnly io.eitheror.casino.reporting.it.* io.eitheror.casino.reporting.port.* io.eitheror.casino.reporting.features.*"

  # support-agent (spec 017): its own sbt build, on ankka 0.16.2, against the contract published from this
  # commit. `sbt test` runs the unit suites; the integration, parity and feature suites start Postgres in
  # Docker and run with -Dit=true. Every model and judge is scripted: no key is needed.
  support-agent:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.support-agent == 'true'
    runs-on: ubuntu-latest
    steps:
