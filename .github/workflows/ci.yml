        run: sbt test

  # players (spec 008), every brand's account service: its own sbt build against the contract published
  # from this commit; its integration suites start Postgres in Docker. The players driver's offline
  # checks run in the check job's `go test ./...`.
  players:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.players == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish the contract locally
        run: sbt contract/publishLocal
      - name: players' suites
        working-directory: services/players
        run: sbt test

  # attribution (spec 012), a core service of every brand: its own sbt build against the contract
  # published from this commit. `sbt test` runs the unit suites; the integration, parity and feature
  # suites start Postgres in Docker and run with -Dit=true. The driver's offline checks run in the check
  # job's `go test ./...`.
  attribution:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.attribution == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish the contract locally
        run: sbt contract/publishLocal
      - name: attribution's unit suites
        working-directory: services/attribution
        run: sbt test
      - name: attribution's integration, parity and feature suites
        working-directory: services/attribution
        run: sbt -Dit=true "testOnly io.eitheror.casino.attribution.it.* io.eitheror.casino.attribution.port.* io.eitheror.casino.attribution.features.*"

  # affiliate-programme (spec 013), the shared programme's service: its own sbt build against the contract
  # published from this commit. `sbt test` runs the unit suites; the integration, parity and feature
  # suites start Postgres in Docker and run with -Dit=true.
  affiliate-programme:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.affiliate-programme == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
