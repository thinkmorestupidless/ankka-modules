name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: astral-sh/setup-uv@v5
      - name: Features, glossary and specs
        run: .github/features-check.sh
      - name: Unit suites and bound features
        run: sbt test
      - name: Every module manifest and every brand's values (spec 021)
        run: sbt "modules/run validate --all"
      - name: The release's publish loop against the fake vendor, moving no channel (spec 021 SC-004)
        run: |
          out="$(mktemp -d)"
          sbt "modules/run release render v9.9.9 --out $out"
          ANKKA_VENDOR_FAKE_LOG="$out/vendor.log" PATH="$PWD/tests/fakes:$PATH" scripts/release-publish.sh "$out" v9.9.9
          ! grep -q '^channels' "$out/vendor.log"
      - name: Schemas match the families
        run: |
          sbt contract/schemas
          git diff --exit-code -- contract/schemas
      - name: Payment-provider stubs and the wallet and merchant drivers' offline checks
        working-directory: tests
        run: go test ./...
      - name: game-provider (spec 003)
        run: |
          sbt contract/publishLocal
          cd services/game-provider && sbt test

  # The wallet (spec 002): its own sbt build against the contract published from this commit. The
  # integration suites start Postgres in Docker, which the hosted runner provides.
  wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish the contract locally
        run: sbt contract/publishLocal
      - name: The wallet's suites
        working-directory: services/wallet
        run: sbt test

  # merchant (spec 004), the shared payments project's first service: its own sbt build against the
  # contract published from this commit; its integration suites start Postgres in Docker. The merchant
  # driver's offline checks run in the check job's `go test ./...`.
  merchant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish the contract locally
        run: sbt contract/publishLocal
      - name: merchant's suites
        working-directory: services/merchant
        run: sbt test

  # psp-gateway (spec 005), the shared payments project's second service: its own sbt build against the
  # contract published from this commit; its integration suites start Postgres and psp-stub (built from
  # tests/stubs/psp-stub/Dockerfile) in Docker. The stubs' and the gateway driver's offline checks run
  # in the check job's `go test ./...`.
  psp-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish the contract locally
        run: sbt contract/publishLocal
      - name: psp-gateway's suites
        working-directory: services/psp-gateway
        run: sbt test

  # The game provider simulator (spec 020): its own sbt build against the contract published from this
  # commit; its suites start Postgres in Docker and run the features of features/simulator.
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish the contract locally
        run: sbt contract/publishLocal
      - name: The simulator's suites
        working-directory: services/game-provider-simulator
        run: sbt test

  # The integration suites, on a kind installation of ankka. Manual only: it takes the time a full
  # platform install takes, and it needs the ankka repository's local installer.
  kind:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: thinkmorestupidless/ankka
          ref: v0.13.0
          path: ankka
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: helm/kind-action@v1
        with:
          cluster_name: ankka
      - name: Install ankka locally
        working-directory: ankka
        run: ./deploy-local.sh
      - name: Integration suites
        env:
          CASINO_IT: "1"
        run: sbt modulesIt/test
