# The casino's Keycloak at the issuer the manifests name (`keycloak.issuerBase`), through ankka's own
# gateway and its wildcard certificate. The gateway's HTTPS listener admits routes from namespaces
# labelled as ankka's (see the namespace patch in kustomization.yaml). Keycloak learns the public port
# only from X-Forwarded-Port, so the issuer it writes carries :8443, as ankka's own identity route does.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: casino-keycloak
  namespace: casino-identity
spec:
  hostnames: [auth-casino.127.0.0.1.sslip.io]
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ankka
      namespace: ankka-gateway
      sectionName: https
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - { name: X-Forwarded-Port, value: "8443" }
      backendRefs:
        - { kind: Service, name: casino-keycloak, port: 80 }
