# attribution's configuration, above ankka's defaults. The database, HTTP port and identity come from
# the platform in a deployment (ANKKA_DB_*, ANKKA_HTTP_PORT); nothing here is needed to start.

# The name a local run reads topics under.
ankka.service.name = "attribution"

# SC-004: a fact on the feed within 60 s of its input. The feed is two projections behind the input (the
# record's publisher, then the feed's appender); the 3 s default polling would spend a tenth of the bound
# on reads alone. This is the polling knob, not `behind-current-time`, which guards correctness.
pekko.persistence.r2dbc.refresh-interval = 1s
