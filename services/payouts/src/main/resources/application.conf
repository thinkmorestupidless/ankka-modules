# payouts' configuration, above ankka's defaults (ankka-runtime's reference.conf).
#
# The database defaults to localhost:5432; `just payouts-run` points it at docker-compose.yml's Postgres on
# 5439 through ANKKA_DB_PORT. In a deployment the platform sets ANKKA_DB_*, ANKKA_HTTP_PORT and the rest.

ankka.service.name = "payouts"

# The wallet on a request's path answers within the request's 2 s bound (SC-005); the gateway is called
# only from the workflow and the catalogue's timer, each of which waits and asks again on no answer.
ankka.service-client.timeout = 2s
