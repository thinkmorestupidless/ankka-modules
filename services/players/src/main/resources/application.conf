# players' configuration, above ankka's defaults. The database, HTTP port and identity come from the
# platform in a deployment (ANKKA_DB_*, ANKKA_HTTP_PORT); nothing here is needed to start.

# The name a local run reads topics under.
ankka.service.name = "players"

# Kept at 30s, as every service here: the bounds on each call (may-log-in, the realm's answer, an
# export part) are the callers' own races, research R4 and R17.
ankka.service-client.timeout = 30s

# The realm's authenticator and sign-in read the entity, never a view; the operator's lists and the
# reconciler read views, and a second's lag is what they are written for (SC-002 is 2 s).
pekko.persistence.r2dbc.refresh-interval = 1s
