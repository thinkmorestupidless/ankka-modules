# reporting's configuration, above ankka's defaults (ankka-runtime's reference.conf).
#
# The database defaults to localhost:5432; `just reporting-run` points it at docker-compose.yml's Postgres on 5445
# through ANKKA_DB_PORT. In a deployment the platform sets ANKKA_DB_*, ANKKA_HTTP_PORT and the rest.

ankka.service.name = "reporting"
