# responsible-gambling's configuration, above ankka's defaults (ankka-runtime's reference.conf).
#
# The database defaults to localhost:5432; `just rg-run` points it at docker-compose.yml's Postgres on
# 5436 through ANKKA_DB_PORT. In a deployment the platform sets ANKKA_DB_* and ANKKA_HTTP_PORT.

ankka.service.name = "responsible-gambling"

# The one outbound call is the sync to `players`' exclusion route, from a timer, never on a check.
ankka.service-client.timeout = 2s
