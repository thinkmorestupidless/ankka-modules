# engagement's configuration, above ankka's defaults (ankka-runtime's reference.conf).
#
# The database defaults to localhost:5432; `just engagement-run` points it at docker-compose.yml's Postgres on
# 5442 through ANKKA_DB_PORT. In a deployment the platform sets ANKKA_DB_*, ANKKA_HTTP_PORT and the rest.

ankka.service.name = "engagement"

# players and rewards answer the webhook's relays within a request's bound.
ankka.service-client.timeout = 2s
