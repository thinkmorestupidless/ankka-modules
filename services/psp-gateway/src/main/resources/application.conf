# psp-gateway's configuration, above ankka's defaults. The database, HTTP port and identity come from
# the platform in a deployment (ANKKA_DB_*, ANKKA_HTTP_PORT); nothing here is needed to start.

# The name a local run reads topics under.
ankka.service.name = "psp-gateway"

# Every call to merchant and to a brand's payouts is bounded at 10 seconds (FR-015): the deliverer's
# per-call bound and the credential read's. ankka 0.11 has no per-call timeout, so the service's is it.
ankka.service-client.timeout = 10s
