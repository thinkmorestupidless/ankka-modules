# ingest's configuration, above ankka's defaults. The database, HTTP port and identity come from the
# platform in a deployment (ANKKA_DB_*, ANKKA_HTTP_PORT); nothing here is needed to start.

# The name a local run reads topics under.
ankka.service.name = "ingest"

# Not lowered: the caller is answered at ANSWER_BOUND by the handler's own race, and merchant is still
# heard until this passes, so an answer that comes late is caught as a lost answer (research R6).
ankka.service-client.timeout = 30s

# SC-007: an operator finds a request within 2 s of it. The views read the records' changes by polling,
# and under the 3s default a record was not in `requests` within 2 s (SmokeSuite, measured). This is the
# polling knob, not `behind-current-time`, which guards correctness and is never tuned down. It costs one
# query a second from each of the service's four live streams.
pekko.persistence.r2dbc.refresh-interval = 1s
