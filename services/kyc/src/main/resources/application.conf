# kyc's configuration, above ankka's defaults (ankka-runtime's reference.conf).
#
# The database defaults to localhost:5432; `just kyc-run` points it at docker-compose.yml's Postgres on
# 5438 through ANKKA_DB_PORT. In a deployment the platform sets ANKKA_DB_*, ANKKA_HTTP_PORT and ANKKA_S3_*.

ankka.service.name = "kyc"

# The one outbound call is `players`' suspend, from the window timer, never on a gate.
ankka.service-client.timeout = 2s
