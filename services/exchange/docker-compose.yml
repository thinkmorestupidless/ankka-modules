# Postgres for running exchange locally: the event journal, snapshots, durable state, view tables and
# projection offsets. The schema comes from target/ddl, which `sbt schema` fills from the ankka-runtime
# artifact — run that first. After an ankka upgrade: `docker compose down -v`, `sbt schema`, `docker compose up -d`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ankka
      POSTGRES_PASSWORD: ankka
      POSTGRES_DB: ankka
    ports:
      - "5440:5432"
    volumes:
      - ./target/ddl:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ankka -d ankka"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
