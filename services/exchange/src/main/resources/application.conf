# exchange's configuration, above ankka's defaults (ankka-runtime's reference.conf).
#
# The database defaults to localhost:5432; `just exchange-run` points it at docker-compose.yml's Postgres on
# 5440 through ANKKA_DB_PORT. In a deployment the platform sets ANKKA_DB_* and ANKKA_HTTP_PORT.

ankka.service.name = "exchange"

# Calls to the brand's other services fail closed; a gate or the wallet that does not answer in time
# is unavailable (spec 023 R3, R4).
ankka.service-client.timeout = 500ms
